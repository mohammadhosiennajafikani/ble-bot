<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 951px; height: 727px; background-color: #0b0f19; font-family: 'Vazirmatn', sans-serif; overflow: hidden; position: relative; }
    .bg-image { position: absolute; top: 0; left: 0; width: 951px; height: 727px; object-fit: cover; z-index: 1; }
    .bg-overlay { position: absolute; top: 0; left: 0; width: 951px; height: 727px; background: rgba(0, 0, 0, 0.45); z-index: 2; }
    .x-logo { position: absolute; top: 20px; left: 20px; width: 22px; height: 22px; fill: #ffffff; opacity: 0.8; z-index: 10; }
    
    /* کارت توییت فیگما */
    .tweet-card {
      position: absolute; width: 655px; left: 148px; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 24px 20px; z-index: 10; display: flex; gap: 14px; direction: rtl;
    }
    .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
    .content-col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .header-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .profile-name { color: #ffffff; font-size: 16px; font-weight: 700; }
    .verified { color: #1d9bf0; font-size: 14px; }
    .handle { color: #8899a6; font-size: 14px; direction: ltr; font-family: 'Inter', sans-serif; }
    .tweet-text { color: #f8fafc; font-size: 15.5px; line-height: 27px; text-align: right; white-space: pre-line; }
    .tweet-text .hashtag { color: #1F8AE8; font-weight: 600; }
    .inner-media { width: 100%; max-height: 300px; border-radius: 16px; overflow: hidden; margin-top: 6px; }
    .inner-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stats-row { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #71767b; font-size: 13px; font-family: 'Inter', sans-serif; }
    .stats-row span { display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <img src="{{bg_image_url}}" class="bg-image" alt="BG">
  <div class="bg-overlay"></div>
  <svg class="x-logo" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

  <div class="tweet-card">
    <img src="{{avatar_url}}" class="avatar-img" alt="Avatar">
    <div class="content-col">
      <div class="header-row">
        <span class="profile-name">{{profile_name}}</span>
        <span class="verified">✓</span>
        <span class="handle">{{handle}}</span>
      </div>
      <div class="tweet-text">{{body_html}}</div>
      {{#has_media}}
      <div class="inner-media"><img src="{{inner_media_url}}"></div>
      {{/has_media}}
      <div class="stats-row">
        <span>💬 </span>
        <span style="color: #00ba7c;">🔁 </span>
        <span style="color: #f91880;">❤️ </span>
        <span>📊 </span>
        <span>🔖</span>
      </div>
    </div>
  </div>
</body>
</html>
